name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验 plugin.toml 与入口一致性
        run: python .github/scripts/validate_manifest.py

      - name: 字节码编译
        run: python -m compileall -q __init__.py

      - name: Ruff 静态检查
        run: pip install ruff && ruff check .
